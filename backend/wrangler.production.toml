name = "cloudpaste-spa"
account_id = "5f0f967f8a7514a497861b1e1f7147e5"
main = "unified-entry.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true
workers_dev = false
preview_urls = false
routes = [{ pattern = "cloudpaste.newstardev.me", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "cloudpaste-db"
database_id = "ece680e8-a11e-4e2f-ad84-e7c6c8da7f94"

[[workflows]]
binding = "JOB_WORKFLOW"
name = "job-workflow"
class_name = "JobWorkflow"

[triggers]
crons = ["*/5 * * * *"]

[assets]
directory = "../frontend/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/dav/*"]

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
enabled = true
invocation_logs = true

